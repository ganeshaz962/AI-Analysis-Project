# Should return HTTP 200 (Allowed by WAF):
#   curl -I https://ttgfriends.in/login

# Should return HTTP 403 (Blocked by WAF):
#   curl -I https://ttgfriends.in/
#   curl -I https://ttgfriends.in/admin
#   curl -I https://ttgfriends.in/dashboard
#   curl -I https://ttgfriends.in/api/users


# ─────────────────────────────────────────────────────────────────────────────
# AZURE ↔ CLOUDFLARE MAPPING
# ─────────────────────────────────────────────────────────────────────────────
#
#  Azure App GW WAF field      │  Cloudflare WAF expression field
#  ────────────────────────────┼──────────────────────────────────
#  Match type   : String       │  (string comparison, default)
#  Match variable: Request URI │  http.request.uri.path
#  Operation    : Is           │  eq  / contains
#  Operator     : Contains     │  contains
#  Match value  : /login       │  "/login"
#  Rule action  : Allow        │  action: allow / skip
#  Priority     : 1            │  priority: 1
# ─────────────────────────────────────────────────────────────────────────────
