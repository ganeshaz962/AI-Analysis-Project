# Cloudflare WAF Custom Rules
# Domain: ttgfriends.in
# Replicating Azure App Gateway WAF rule:
#   Allow traffic ONLY when Request URI contains /login
#   Block everything else

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO ADD THESE RULES IN CLOUDFLARE DASHBOARD
# Security → WAF → Custom rules → Create rule
# ─────────────────────────────────────────────────────────────────────────────


# ═══════════════════════════════════════════════════════
# RULE 1 – BLOCK ALL TRAFFIC EXCEPT /login  (Priority 1)
# ═══════════════════════════════════════════════════════
#
# Rule name : Block non-login paths
# Expression:
#
#   (http.host eq "ttgfriends.in" and not http.request.uri.path contains "/login")
#
# Action    : Block
# Priority  : 1
#
# ── What it does ────────────────────────────────────────
# Any request to ttgfriends.in whose URI path does NOT
# contain "/login" is immediately blocked (HTTP 403).
# This matches the Azure WAF "Allow only /login" intent:
#   Match variable : Request URI
#   Operation      : Is  (contains)
#   Operator       : Contains
#   Match value    : /login
# ────────────────────────────────────────────────────────


# ═══════════════════════════════════════════════════════
# RULE 2 – ALLOW /login  (Priority 2)
# ═══════════════════════════════════════════════════════
#
# Rule name : Allow login path
# Expression:
#
#   (http.host eq "ttgfriends.in" and http.request.uri.path contains "/login")
#
# Action    : Skip → Skip all remaining custom rules
# Priority  : 2
#
# ── What it does ────────────────────────────────────────
# Requests that reach /login are explicitly allowed through
# and skip any further custom rules.
# ────────────────────────────────────────────────────────


# ─────────────────────────────────────────────────────────────────────────────
# CLOUDFLARE API — Create rules via REST (replace YOUR_ZONE_ID & API_TOKEN)
# ─────────────────────────────────────────────────────────────────────────────

# RULE 1 – Block non-login paths
# curl -X POST "https://api.cloudflare.com/client/v4/zones/YOUR_ZONE_ID/firewall/rules" \
#   -H "Authorization: Bearer YOUR_API_TOKEN" \
#   -H "Content-Type: application/json" \
#   --data '[
#     {
#       "filter": {
#         "expression": "(http.host eq \"ttgfriends.in\" and not http.request.uri.path contains \"/login\")"
#       },
#       "action": "block",
#       "description": "Block non-login paths",
#       "priority": 1,
#       "paused": false
#     }
#   ]'


# RULE 2 – Allow /login
# curl -X POST "https://api.cloudflare.com/client/v4/zones/YOUR_ZONE_ID/firewall/rules" \
#   -H "Authorization: Bearer YOUR_API_TOKEN" \
#   -H "Content-Type: application/json" \
#   --data '[
#     {
#       "filter": {
#         "expression": "(http.host eq \"ttgfriends.in\" and http.request.uri.path contains \"/login\")"
#       },
#       "action": "allow",
#       "description": "Allow login path",
#       "priority": 2,
#       "paused": false
#     }
#   ]'


